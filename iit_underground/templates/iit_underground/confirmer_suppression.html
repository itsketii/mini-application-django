{% extends "iit_underground/base.html" %}
{% block title %}Supprimer - IIT Underground{% endblock %}
{% block content %}
    <h1>Supprimer le post</h1>
    <p>Êtes-vous sûr de vouloir supprimer ce post ?</p>
    <div class="card">
        <p>{{ potin.titre}}</p>
    </div>
    <form method="post">
        {% csrf_token %}
        <button class="btn" type="submit">Confirmer la suppression</button>
        <a class="btn" href="{% url 'iit_underground:fil' %}">Annuler</a>
    </form>
{% endblock %}
