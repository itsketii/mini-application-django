{% extends "iit_underground/base.html" %}
{% block title %}Supprimer - IIT Underground{% endblock %}
{% block content %}
<h1 class="mb-3">Supprimer le post</h1>
<p>Êtes-vous sûr de vouloir supprimer ce post ?</p>
<div class="card p-3 mb-3">
    <p class="mb-0">{{ post.titre }}</p>
</div>
<form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
        <button class="btn btn-scandale" type="submit">Confirmer la suppression</button>
        <a class="btn btn-outline-secondary" href="{% url 'iit_underground:fil' %}">Annuler</a>
    </div>
</form>
{% endblock %}
