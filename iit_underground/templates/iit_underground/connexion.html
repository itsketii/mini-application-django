{% extends "iit_underground/base.html" %}
{% block content %}
<h2 class="mb-4">Connexion</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-scandale" type="submit">Se connecter</button>
</form>
<p class="text-muted-custom mt-3">
    Pas encore de compte ? <a href="{% url 'iit_underground:inscription' %}" class="text-link">S'inscrire</a>
</p>
{% endblock %}
