{% extends "iit_underground/base.html" %}
{% block title %}Inscription - IIT Underground{% endblock %}
{% block content %}
<div class="d-flex flex-column align-items-center text-center mb-4">
    <h1 style="color:#E30613;">IIT Underground</h1>
    <p class="text-muted-custom">Rejoins la communauté et balance tes scoops.</p>
</div>

<div class="card p-4 mx-auto" style="max-width: 450px;">
    <h2 class="h5 mb-3">Créer un compte</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-scandale w-100 mt-2" type="submit">S'inscrire</button>
    </form>
</div>
{% endblock %}
