{% extends 'iit_underground/base.html' %}
{% block title %}Supprimer le commentaire{% endblock %}
{% block content %}
<h1 class="mb-3">Supprimer le commentaire</h1>
<p>Êtes-vous sûr de vouloir supprimer ce commentaire ?</p>
<div class="card p-3 mb-3">
    <p class="mb-0">{{ commentaire.contenu }}</p>
</div>
<form method="post">
    {% csrf_token %}
    <div class="d-flex gap-2">
        <button class="btn btn-danger" type="submit">Confirmer</button>
        <a class="btn btn-outline-secondary" href="{% url 'iit_underground:detail' post_id=commentaire.potin.id %}">Annuler</a>
    </div>
</form>
{% endblock %}
