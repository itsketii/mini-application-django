{% load static %}
<!doctype html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}IIT Underground{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'iit_underground/style.css' %}" />
</head>
<body>
    <nav class="navbar navbar-expand px-4">
        <span class="navbar-brand">IIT Underground</span>
        <div class="ms-auto d-flex align-items-center gap-3">
            <a href="{% url 'iit_underground:fil' %}" class="text-decoration-none">Fil d'actualité</a>
            {% if user.is_authenticated %}
                <a href="{% url 'iit_underground:creer' %}" class="text-decoration-none">Publier</a>
                <a href="{% url 'iit_underground:profil' %}" class="text-decoration-none">{{ user.username }}</a>
                <form action="{% url 'logout' %}" method="post" class="mb-0">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link text-decoration-underline p-0" style="color:#F5F5F5;">Déconnexion</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="text-decoration-none">Connexion</a>
            {% endif %}
        </div>
    </nav>

    <div class="container py-4" style="max-width: 700px;">
        {% block content %}{% endblock %}
    </div>

    <footer class="text-center">
        <p>&copy; 2026 IIT Underground. Tous droits réservés.</p>
    </footer>
</body>
</html>
