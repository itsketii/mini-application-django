{% load static %}
<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}IIT Underground{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'iit_underground/style.css' %}" />
  </head>
  <body>
    <nav>
      <span class="logo">IIT Underground</span>
      <div>
        <a href="{% url 'iit_underground:fil' %}">Fil d'actualité</a>
        {% if user.is_authenticated %}
        <a href="{% url 'iit_underground:creer' %}">Publier</a>
        <a href="{% url 'iit_underground:profil' %}">{{ user.username }}</a>
        <form action="{% url 'logout' %}" method="post" style="display: inline">
          {% csrf_token %}
          <button
            type="submit"
            class="muted"
            style="
              background: none;
              border: none;
              padding: 0;
              cursor: pointer;
              text-decoration: underline;
            "
          >
            Déconnexion
          </button>
        </form>
        {% else %}
        <a href="{% url 'login' %}">Connexion</a>
        {% endif %}
      </div>
    </nav>

    <div class="container">{% block content %} {% endblock %}</div>

    <footer>
      <p>&copy; 2026 IIT Underground. Tous droits réservés.</p>
    </footer>
  </body>
</html>
